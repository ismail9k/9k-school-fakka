# CI/CD for Fakka.
#
#   CI  (every pull request, and every push to develop or master):
#       lint -> typecheck -> test -> build
#   CD  (only after CI passes):
#       pull request    -> Cloudflare Workers Preview named "pr-<number>", URL commented on the PR
#       push to develop -> Cloudflare Workers Preview named "develop"
#       push to master  -> production deploy of the `fakka` Worker
#       PR closed       -> its preview is deleted
#
# Previews use the `previews` block in wrangler.jsonc: their own D1 database,
# Turnstile test keys, and no emails.
# Deploys need two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# They are passed only to the steps that call Cloudflare, never to install steps.
# Third-party actions are pinned to a commit SHA; Dependabot bumps them.

name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [develop, master]

permissions:
  contents: read

# One run per branch or PR at a time. A newer PR event cancels the older run;
# pushes to develop and master queue instead, so a deploy is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test, build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json), Node 22, and runs `pnpm install`.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  preview:
    name: Deploy preview
    needs: ci
    # Pull requests from forks get no secrets, so they stop after CI.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'develop' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      # Cloudflare's public always-pass Turnstile test key, so the preview form
      # works without a real widget. It matches the test secret in wrangler.jsonc.
      - run: pnpm build
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      # All previews share one D1 database, separate from production.
      - run: pnpm db:migrate:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: preview --name ${{ env.PREVIEW_NAME }} --message ${{ github.sha }}

      - name: Show preview URL
        run: |
          echo "Preview **$PREVIEW_NAME**: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

      # One comment per PR, updated on every push.
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview for this PR: $PREVIEW_URL (commit $GITHUB_SHA)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

  preview-cleanup:
    name: Delete PR preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true
      - run: pnpm exec wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      # Same steps as `pnpm run deploy`, one per line so each shows in the log.
      - run: node scripts/check-release-env.mjs
      - run: pnpm build
      - run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
