# CI/CD for Fakka.
#
#   CI  (every pull request, and every push to develop or master):
#       lint -> typecheck -> test -> build
#   CD  (only after CI passes):
#       pull request    -> Cloudflare Workers Preview named "pr-<number>", URL commented on the PR
#       push to develop -> Cloudflare Workers Preview named "develop"
#       push to master  -> production deploy of the `fakka` Worker
#       PR closed       -> its preview is deleted
#
# Previews use the `previews` block in wrangler.jsonc: their own D1 database
# and no emails. This demo uses Cloudflare's always-pass Turnstile test keys
# everywhere (.env.production and wrangler.jsonc).
# Deploys need two repository secrets: CLOUDFLARE_API_TOKEN (Workers access only)
# and CLOUDFLARE_ACCOUNT_ID. CI never touches D1: run migrations by hand with
# `pnpm db:migrate:preview` / `pnpm db:migrate:remote` before shipping one.
# They are passed only to the steps that call Cloudflare, never to install steps.
# Third-party actions are pinned to a commit SHA; Dependabot bumps them.

name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [develop, master]

permissions:
  contents: read

# One run per PR, and one per pushed branch. Keyed on the PR number because a
# merged PR's "closed" event reports the base branch (e.g. develop) as its ref
# and would otherwise cancel that branch's deploy. A newer PR event cancels the
# older run; pushes to develop and master queue instead, so a deploy is never
# cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test, build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json), Node 22, and runs `pnpm install`.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  preview:
    name: Deploy preview
    needs: ci
    # Pull requests from forks and from Dependabot get no secrets, so they stop after CI.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'develop' }}
      # On a PR, github.sha is GitHub's temporary merge commit; show the PR's own head commit.
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Used by scripts/preview-comment.sh, which keeps one preview card per PR.
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LOGS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Mark the PR preview as deploying
        if: github.event_name == 'pull_request'
        run: scripts/preview-comment.sh deploying
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      - run: pnpm build

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: preview --name ${{ env.PREVIEW_NAME }} --message ${{ env.COMMIT_SHA }}

      - name: Show preview URL
        run: |
          echo "Preview **$PREVIEW_NAME**: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

      # Runs after a failure too (but not when a newer push cancelled this run),
      # so the card never stays stuck on "Deploying".
      - name: Update the PR preview card
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: scripts/preview-comment.sh ${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.preview-deployment-url }}

  preview-cleanup:
    name: Delete PR preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true
      # A PR that never deployed (CI failed, or it came from a fork) has no
      # preview to delete; only that case is allowed to pass.
      - name: Delete preview
        run: |
          if ! output="$(pnpm exec wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation 2>&1)"; then
            echo "$output"
            grep -q "Preview not found" <<<"$output" || exit 1
            echo "No preview named pr-$PR_NUMBER; nothing to delete."
          else
            echo "$output"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true

      # `pnpm run deploy` minus the D1 migrations: the CI token has no D1
      # access, so migrations are run by hand (see README).
      - run: node scripts/check-release-env.mjs
      - run: pnpm build

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
